<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Quicklist</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style/index.css">
</head>
<body>
  <div class="container">
    <main>
      <a href="#" class="link-Button">&lt;- Voltar</a>
      <h1>Compras da semana</h1>
      <div class="input-Buttons">
        <input class="input-Text" id="input" type="text" placeholder="Adicione um novo item">
        <button class="input-Button" id="button">Adicionar item</button>
      </div>
      <div class="list-container">
        <div>
          <ul class="list-group">
            <li class="list-content">
              <label>
                <input class="checkbox" type="checkbox">
                <span>Pão de forma</span>
              </label>
              <img src="./public/images/bin.svg" alt="Excluir item 1">
            </li>
            <li class="list-content">
              <label>
                <input type="checkbox">
                <span>Café preto</span>
              </label>
              <img src="./public/images/bin.svg" alt="Excluir item 2">
            </li>
            <li class="list-content">
              <label>
                <input type="checkbox">
                <span>Suco de laranja</span>
              </label>
              <img src="./public/images/bin.svg" alt="Excluir item 3">
            </li>
            <li class="list-content">
              <label>
                <input type="checkbox">
                <span>Bolacha</span>
              </label>
              <img src="./public/images/bin.svg" alt="Excluir item 4">
            </li>
          </ul>
        </div>
      </div>
    </main>
  </div>

  <script src="./src/index.js"></script>
</body>
</html>
